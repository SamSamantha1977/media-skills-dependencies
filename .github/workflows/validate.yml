name: Validate lightweight Python media skills
on:
  push:
    paths:
      - 'skills/**'
      - 'dist/**'
      - '.github/workflows/validate.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight image dependencies
        run: python -m pip install -r skills/upscayl-image/requirements.txt
      - name: Validate Python and skill archives
        run: |
          python -m compileall -q skills/upscayl-image/scripts skills/video2x-video/scripts
          python - <<'PY'
          from pathlib import Path
          import zipfile
          for name in ('upscayl-image', 'video2x-video'):
              zpath=Path('dist')/(name+'.zip')
              assert zpath.stat().st_size<50_000_000
              with zipfile.ZipFile(zpath) as z:
                  assert z.testzip() is None
                  names=z.namelist()
                  assert sum(x.lower().endswith('/skill.md') for x in names)==1
                  assert not any(x.lower().endswith(('.exe','.dll','.so')) for x in names)
              print(name,'VALID')
          PY
      - name: Dependency checks without downloading
        run: |
          python skills/upscayl-image/scripts/dependencies.py --check
          python skills/video2x-video/scripts/dependencies.py --check
